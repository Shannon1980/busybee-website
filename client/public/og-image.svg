<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1A2B4A"/>

  <!-- Subtle glow -->
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F5A623" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo: waveform bee icon (scaled up ~5x, centered left) -->
  <g transform="translate(160, 235) scale(5)">
    <circle cx="20" cy="24" r="3.5" fill="#F5A623"/>
    <rect x="4"  y="14.5" width="3" height="3"  rx="1.5" fill="#F5A623"/>
    <rect x="9"  y="13"   width="3" height="6"  rx="1.5" fill="#F5A623"/>
    <rect x="14" y="11.5" width="3" height="9"  rx="1.5" fill="#F5A623"/>
    <rect x="19" y="10"   width="3" height="12" rx="1.5" fill="#F5A623"/>
    <rect x="24" y="11.5" width="3" height="9"  rx="1.5" fill="#F5A623"/>
    <rect x="29" y="13"   width="3" height="6"  rx="1.5" fill="#F5A623"/>
    <rect x="34" y="14.5" width="3" height="3"  rx="1.5" fill="#F5A623"/>
  </g>

  <!-- App name -->
  <text x="440" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#F5A623">Busy</text>
  <text x="580" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF"> Bee</text>

  <!-- Tagline -->
  <text x="440" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="rgba(255,255,255,0.6)">Say it. Scheduled.</text>

  <!-- Sub-tagline -->
  <text x="440" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="rgba(255,255,255,0.35)">Voice-first calendar assistant · iOS · Launching April 14, 2026</text>

  <!-- Bottom border accent -->
  <rect x="0" y="610" width="1200" height="4" fill="#F5A623" opacity="0.6"/>
</svg>
